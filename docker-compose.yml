# 本文件负责解决的就是： MySQL、Redis、后端、Nginx 等等东西怎么一起被拉起来，并且彼此连通，是项目运行总装配图
services:
  #这份 compose ，其实已经能看到 3 层：
  #### 第一层：基础数据层
  #- mysql
  #- redis
  #### 第二层：基础设施层
  #- rocketmq
  #- nacos
  #### 第三层：应用接入层
  #- backend
  #- gateway
  #- nginx

  mysql:
    #它对应的是你以前本机手工装的 MySQL。
    image: mysql:8.0
    container_name: peaksend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "060723"
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./数据库/sky.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./数据库/day15_flash_sale.sql:/docker-entrypoint-initdb.d/02-day15-flash-sale.sql:ro

  redis:
    #它对应的是你以前本机手工开的 Redis。
    image: redis:6.2-alpine
    container_name: peaksend-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "060723"]
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: peaksend-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    healthcheck:
      #别只看 nacos 容器“启动了”，还得看它“真的健康可用了”。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/servers > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: peaksend-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: peaksend-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: peaksend-rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqbroker -n peaksend-rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf:ro

  backend:
    #这一块的核心意思就是：后端以后不再默认认为数据库和 Redis 在你本机上，而是认为它们是 compose 里另外两个服务
    build:
      context: ./peaksend-backend
      dockerfile: Dockerfile
    container_name: peaksend-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      nacos:
        condition: service_healthy
    environment:
      #这里其实是把“backend 启动时该连谁”全部喂进去。
      #Compose 里服务名本身，就是 Docker 内部网络里的可访问地址，即容器内部按服务名通信
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sky_take_out
      DB_USERNAME: root
      DB_PASSWORD: "060723"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "060723"
      NACOS_SERVER_ADDR: peaksend-nacos:8848
      SKY_NACOS_DISCOVERY_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: peaksend-rocketmq-namesrv:9876
      SKY_ROCKETMQ_ENABLED: "true"
      SKY_ROCKETMQ_ORDER_DELAY_ENABLED: "true"
      SKY_ROCKETMQ_ORDER_DELAY_LEVEL: "3"
      SKY_ROCKETMQ_FLASH_SALE_ASYNC_ENABLED: "true"
      LOCAL_UPLOAD_BASE_PATH: /app/uploads
      WECHAT_APPID: "wxbfdcbbe6d7823895"
      WECHAT_SECRET: "df96866efe9a6fce7e62a56633818b95"
      WECHAT_PAY_MODE: mock
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads

  gateway:
    build:
      context: ./peaksend-backend
      dockerfile: Dockerfile.gateway
      #这个网关不是外部软件，而是我们项目里的一个 Java 模块。
    container_name: peaksend-gateway
    restart: unless-stopped
    depends_on:
      #- 没 Nacos，它没法做服务发现
      #- 没 backend，它转发目标都没了
      nacos:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NACOS_SERVER_ADDR: peaksend-nacos:8848
      SKY_NACOS_DISCOVERY_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"

  nginx:
    #  继续保留你当前管理端页面访问方式，同时把 /api/ 、 /user/ 、 /ws/ 这些请求转发给后端容器
    #  所以它对应的是你以前本机单独跑的 Nginx

    image: nginx:1.27-alpine
    container_name: peaksend-nginx
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "8081:8081"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./FrontRunEnv/nginx-1.20.2/html:/usr/share/nginx/html:ro
