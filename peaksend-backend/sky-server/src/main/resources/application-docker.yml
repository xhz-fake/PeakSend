server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST:mysql}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:060723}
  local-upload:
    base-path: ${LOCAL_UPLOAD_BASE_PATH:/app/uploads}
  wechat:
    appid: ${WECHAT_APPID:demo-appid}
    secret: ${WECHAT_SECRET:demo-secret}
    pay-mode: ${WECHAT_PAY_MODE:mock}
  cache:
    default-ttl: 30m
    category-ttl: 20m
    dish-ttl: 30m
    setmeal-ttl: 35m
    address-book-by-id-ttl: 2m
    report-ttl: 5m
  rocketmq:
    enabled: ${SKY_ROCKETMQ_ENABLED:false}
    order-delay-enabled: ${SKY_ROCKETMQ_ORDER_DELAY_ENABLED:false}
    flash-sale-async-enabled: ${SKY_ROCKETMQ_FLASH_SALE_ASYNC_ENABLED:false}
    order-delay-level: ${SKY_ROCKETMQ_ORDER_DELAY_LEVEL:14}

spring:
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:060723}
    database: ${REDIS_DATABASE:0}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}
  producer:
    group: peaksend-producer-group
