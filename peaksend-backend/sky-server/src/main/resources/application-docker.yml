#给 Docker 运行态专门准备的一份依赖寻址配置。

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DB_HOST:mysql}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:060723}
  local-upload:
    base-path: ${LOCAL_UPLOAD_BASE_PATH:/app/uploads}
  wechat:
    appid: ${WECHAT_APPID:demo-appid}
    secret: ${WECHAT_SECRET:demo-secret}
    pay-mode: ${WECHAT_PAY_MODE:mock}
    #Docker 环境下，不只是基础设施地址要切，运行态业务配置也可以通过环境变量喂进来。
  cache:
    default-ttl: 30m
    category-ttl: 20m
    dish-ttl: 30m
    setmeal-ttl: 35m
    address-book-by-id-ttl: 2m
    report-ttl: 5m
  rocketmq:
    enabled: ${SKY_ROCKETMQ_ENABLED:false}
    order-delay-enabled: ${SKY_ROCKETMQ_ORDER_DELAY_ENABLED:false}
    flash-sale-async-enabled: ${SKY_ROCKETMQ_FLASH_SALE_ASYNC_ENABLED:false}
    order-delay-level: ${SKY_ROCKETMQ_ORDER_DELAY_LEVEL:14}
    #RocketMQ 相关能力是否开启、延迟级别是多少，不写死在代码里，而是交给运行环境决定。

spring:
  cloud:
    nacos:
      discovery:
        enabled: ${SKY_NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:peaksend-nacos:8848}
        #这就是 Day17 最核心的 backend 侧新增配置。
        #它的意思是：
        #1. 是否开启服务注册发现能力
        #2. 如果开启，要去哪个 Nacos 注册中心报到
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:060723}
    database: ${REDIS_DATABASE:0}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq-namesrv:9876}
  producer:
    group: peaksend-producer-group
